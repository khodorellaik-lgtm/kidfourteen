<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="geometricPrecision">
  <!-- Background -->
  <rect x="0" y="0" width="100" height="100" rx="10" fill="#070A0E"/>

  <!-- Subtle inner glow -->
  <rect x="4" y="4" width="92" height="92" rx="8" fill="none" stroke="rgba(127,233,255,0.18)" stroke-width="2"/>

  <!-- K14 (custom geometry, NOT a font) -->
  <g fill="#7FE9FF">
    <!-- K -->
    <!-- vertical stem -->
    <rect x="14" y="22" width="10" height="56" rx="2"/>
    <!-- upper diagonal -->
    <polygon points="24,50 46,22 56,22 34,50"/>
    <!-- lower diagonal -->
    <polygon points="24,50 34,50 56,78 46,78"/>

    <!-- 1 -->
    <!-- top cap -->
    <rect x="59" y="22" width="18" height="10" rx="2"/>
    <!-- main stem -->
    <rect x="65" y="22" width="10" height="56" rx="2"/>

    <!-- 4 -->
    <!-- right vertical -->
    <rect x="82" y="22" width="10" height="56" rx="2"/>
    <!-- cross bar -->
    <rect x="72" y="48" width="20" height="10" rx="2"/>
    <!-- diagonal / left leg -->
    <polygon points="72,48 62,48 82,22 92,22"/>
  </g>
</svg>
